# RDPfread XD — build configuration (consumed by build.gradle)
# Based on XyDesk Remote's release.properties (Apache-2.0).

COMPILE_API=37
TARGET_API=37
MIN_API=23
TOOLS_VERSION=37.0.0
NDK_VERSION=29.0.13113456
CMAKE_VERSION=4.1.2

ABI_FILTERS=armeabi-v7a;arm64-v8a;x86_64
SPLIT_ARCHITECTURES=armeabi-v7a;arm64-v8a;x86_64
SPLIT_ENABLED=true
BUILD_UNIVERSAL=true
MINIFY_ENABLED=true

VERSION_NAME=0.3.0
