CMAKE_ARGUMENTS=-DWITH_FFMPEG=ON;-DWITH_OPENH264=ON;-DWITH_OPUS=ON;-DWITH_WEBP=ON;-DWITH_JPEG=ON;-DWITH_PNG=ON;-DWITH_CJSON=ON;-DWITH_OPENSSL=ON
